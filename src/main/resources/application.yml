server:
  port: 8762

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8763}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

spring:
  application:
    name: eureka-server
  security:
    user:
      name: ${METRICS_SCRAPE_USERNAME:metrics}
      password: ${METRICS_SCRAPE_PASSWORD:}

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:eureka-server}
  client:
    register-with-eureka: false # el servidor no se registra a sí mismo
    fetch-registry: false # ni descarga el registro
  server:
    enable-self-preservation: false # SOLO desarrollo
    eviction-interval-timer-in-ms: 5000 # expulsa instancias caídas más rápido
